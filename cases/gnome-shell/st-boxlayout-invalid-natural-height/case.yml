id: gnome-shell-st-boxlayout-invalid-natural-height
title: "Fixing a GNOME Shell St.ScrollView 1px layout collapse under unconstrained sizing queries"
status: verified
stack:
  - gnome-shell
  - gjs
  - clutter
  - st
versions:
  os: "Ubuntu 22.04.5 LTS (Linux x86_64)"
  runtime: "GNOME Shell 42.9 (GJS 1.72.4)"
  dependencies:
    mutter: ">= 42.0"
environment:
  hardware: "13th Gen Intel Core i7-1355U / Intel Raptor Lake Graphics"
  extra: "Wayland and X11 GNOME Shell 42.9 Sessions"
symptoms:
  - "St.ScrollView inside a vertical St.BoxLayout collapses to 1px height under unconstrained layout queries"
  - "App launcher or icon grid is created but invisible on screen (appsScroll=1, appsBox=1 in debug logs)"
  - "Custom child actor returns anomalously large natural height when queried with for_width=-1 (negative unconstrained query per Clutter API contract)"
expected_behavior: "St.ScrollView expands smoothly within the vertical St.BoxLayout according to available container space, displaying icon grids correctly without collapsing to 1px"
trigger: "Custom grid actor placed inside St.ScrollView does not sanitize negative forWidth values inside vfunc_get_preferred_height, causing the returned height to be negative or invalid"
root_cause: "Clutter passes negative for_width values as a documented unconstrained query (API contract: 'a negative value to indicate that no width is defined'). The custom ChildGridActor fails to handle this case, producing a negative or invalid natural height. The exact mechanism by which this negative GJS value becomes the large anomalous number visible in logs was not confirmed from Clutter/Mutter source — the origin may be a cast, arithmetic overflow, or logging conversion at a later pipeline stage."


failed_approaches:
  - approach: "Setting arbitrary min-height in CSS without resolving alignment conflicts"
    result: "ScrollView stays fixed size or clips content without responding dynamically to panel size changes"
  - approach: "Calling actor.queue_relayout() inside container build constructor"
    result: "Triggers recursive layout recalculation during GObject init causing state inconsistency"
  - approach: "Using get_parent().get_width() as fallback inside vfunc_get_preferred_height"
    result: "Parent may not yet have an allocation at preferred-size query time; get_width() returns natural width, creating a hidden circular dependency in the preferred-size calculation (Clutter docs: get_width() returns natural width when no allocation exists)"
  - approach: "Relying on multiple parent actors to manage child geometry simultaneously"
    result: "Creates geometry owner conflict where competing actors continuously override allocation boxes"
fix_summary: "Implement defensive forWidth handling in vfunc_get_preferred_height: use intrinsic grid width as fallback when forWidth is negative (not parent.get_width()), guard zero-column edge case with Math.max(1, ...), and clamp return value with Math.max(0, natH). Optionally set x_expand/y_expand to change the preferred-size query path at the layout level — this is a workaround, not a fix, as layout managers may still issue unconstrained queries."
verification:
  automated: true
  command: "bash verify.sh"
  manual_steps:
    - "Install and enable minimal reproduction extension in GNOME Shell"
    - "Open side panel or dock containing St.ScrollView"
    - "Verify that appsScroll allocation height is greater than 100px and icons render properly"
    - "Verify naturalHeight is positive and <= available monitor height"
regression_risks:
  - "ScrollView overflowing panel boundary when total item count is small"
  - "Transient empty AppFavorites grid on initial GNOME Shell startup if AppSystem is not ready"
  - "Accessing disposed DockAppIcon references during async icon rebuild"
sources:
  - "https://gjs.guide/extensions/topics/layout.html"
  - "https://gnome.pages.gitlab.gnome.org/mutter/st/class.BoxLayout.html"
upstream:
  project: "GNOME/gnome-shell"
  issue: null
  merge_request: null
  status: not-submitted
last_verified: "2026-08-07"
