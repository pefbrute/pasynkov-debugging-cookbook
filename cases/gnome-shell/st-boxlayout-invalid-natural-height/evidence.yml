case_id: "gnome-shell/st-boxlayout-invalid-natural-height"

# --- API Contract Claims ---
api_contracts:
  - statement: "for_width parameter is gfloat; min_height_p and natural_height_p are gfloat*"
    source_url: https://gnome.pages.gitlab.gnome.org/mutter/clutter/method.Actor.get_preferred_height.html
    confidence: CONFIRMED
    declaration: "void clutter_actor_get_preferred_height(ClutterActor* self, gfloat for_width, gfloat* min_height_p, gfloat* natural_height_p)"
    notes: ""

  - statement: "A negative for_width value means no width is defined (unconstrained query)"
    source_url: https://gnome.pages.gitlab.gnome.org/mutter/clutter/method.Actor.get_preferred_height.html
    confidence: CONFIRMED
    declaration: "for_width: Available width to assume in computing desired height, or a negative value to indicate that no width is defined."
    notes: ""

  - statement: "for_width = 0 is a formally defined zero-pixel width, not an unconstrained query"
    source_url: https://gnome.pages.gitlab.gnome.org/mutter/clutter/method.Actor.get_preferred_height.html
    confidence: CONFIRMED
    declaration: null
    notes: "Follows from the negative-means-unconstrained contract: zero is a valid non-negative value and is treated as a real zero-pixel width constraint."

  - statement: "If an actor has no valid allocation, get_width() returns the actor's natural width"
    source_url: https://mutter.gnome.org/clutter/method.Actor.get_width.html
    confidence: CONFIRMED
    declaration: "gfloat clutter_actor_get_width(ClutterActor* self) — If the actor does not have a valid allocation, this function will return the actor's natural width"
    notes: ""

  - statement: "St.ScrollView is a single-child container for actors implementing StScrollable"
    source_url: https://gnome.pages.gitlab.gnome.org/gnome-shell/st/class.ScrollView.html
    confidence: CONFIRMED
    declaration: null
    notes: ""

# --- Type / Marshaling Claims ---
type_claims:
  - statement: "The large anomalous value visible in logs when a negative height is returned from GJS does NOT arise from guint marshaling"
    declaration: "gfloat* natural_height_p — output type is gfloat*, not guint*"
    source_url: https://gnome.pages.gitlab.gnome.org/mutter/clutter/method.Actor.get_preferred_height.html
    confidence: CONFIRMED

