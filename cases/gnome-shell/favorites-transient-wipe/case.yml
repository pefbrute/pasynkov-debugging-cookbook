id: gnome-shell-favorites-transient-wipe
title: "Dock wipes favorite app icons during transient AppFavorites unreadiness or custom .desktop ID lookup"
status: verified
stack:
  - gnome-shell
  - gjs
  - shell
versions:
  os: "Ubuntu 22.04 / 24.04 LTS (Linux)"
  runtime: "GNOME Shell 42 / 45 / 46 (GJS, Shell)"
  dependencies:
    mutter: ">= 42.0"
environment:
  hardware: "Any GPU"
  extra: "Wayland and X11 GNOME Shell Sessions"
symptoms:
  - "Favorite application icons disappear from dock on GNOME Shell startup or GSettings reload"
  - "Custom user-installed desktop files (e.g. antigravity.desktop) fail to resolve to Shell.App instances"
expected_behavior: "Dock retains existing favorite icon actors during transient startup delay and resolves custom desktop files reliably"
trigger: "Run app synchronization pass during initial GNOME Shell boot or update favorite-apps GSettings"
root_cause: "Shell.AppSystem.lookup_app(id) returns null for custom desktop IDs during initial desktop file indexing. Additionally, AppFavorites.getAppFavorites().getFavorites() returns [] transiently while favorite-apps GSettings holds non-empty IDs. Running sync at this point evaluates addedSet.has(appId) = false and destroys all favorite icon actors."
failed_approaches:
  - approach: "Relying solely on Shell.AppSystem.get_default().lookup_app(id)"
    result: "Returns null for user-installed custom .desktop files not indexed in standard system paths"
  - approach: "Unconditionally destroying icons missing from getFavorites() return list"
    result: "Wipes dock completely during transient GSettings loading phase"
fix_summary: "Add transient unreadiness check (configuredFavoriteIds.length > 0 && resolvedFavorites.length === 0), use Shell.App.new_for_desktop_id(id) fallback when lookup_app(id) returns null, subscribe to installed-changed on Shell.AppSystem, and retain existing favorite icons if favs transiently evaluates to []."
verification:
  automated: true
  command: "node --check right-dock@pasynkov/appSync.js"
  manual_steps:
    - "Add custom .desktop file to favorite-apps list"
    - "Restart GNOME Shell"
    - "Verify custom favorite icons render cleanly and are not wiped"
regression_risks:
  - "Stale favorite icons persisting if GSettings intentionally cleared to empty array"
sources:
  - "https://gjs.guide/extensions/topics/shell-app-system.html"
upstream:
  project: "GNOME/gjs-guide"
  issue: null
  merge_request: null
  status: not-submitted
last_verified: "2026-08-07"
