id: gnome-shell-disposed-gobject-access-crash
title: "GJS throws fatal error accessing already disposed C/Clutter objects"
status: verified
stack:
  - gnome-shell
  - gjs
  - clutter
  - st
versions:
  os: "Ubuntu 22.04 / 24.04 LTS (Linux)"
  runtime: "GNOME Shell 42 / 45 / 46 (GJS, Clutter, St)"
  dependencies:
    mutter: ">= 42.0"
environment:
  hardware: "Any GPU"
  extra: "Wayland and X11 GNOME Shell Sessions"
symptoms:
  - "JS ERROR: Object St.Widget, has been already disposed — impossible to access it"
  - "Extension crash or aborted sync loop when calling methods on destroyed actor references"
expected_behavior: "Extension handles GObject lifecycle safely without accessing disposed C instances or leaking stale references in JS maps"
trigger: "Reload extension, rebuild actor tree, or call methods on cached actor references after container destruction"
root_cause: "Retaining JavaScript object references (such as Map or class fields) to C-level GObjects after they have been destroyed by Clutter container teardown. Calling GObject methods on disposed wrappers throws an unhandled GJS exception."
failed_approaches:
  - approach: "Calling actor.destroy() while keeping the actor inside a Map or class field"
    result: "Leaves stale wrapper reference that throws Error: Object has been already disposed when accessed"
fix_summary: "Remove references from JS maps/containers before calling destroy(), connect a destroy signal listener on each GObject to clear JS references automatically on disposal, and wrap property updates in try/catch or is_finalized check."
verification:
  automated: true
  command: "node --check right-dock@pasynkov/appSync.js"
  manual_steps:
    - "Trigger rapid extension re-enable/reload"
    - "Verify journalctl logs contain no 'already disposed' errors"
regression_risks:
  - "Dangling signal listeners if not disconnected on destroy"
sources:
  - "https://gjs.guide/guides/gjs/memory-management.html"
upstream:
  project: "GNOME/gjs-guide"
  issue: null
  merge_request: null
  status: not-submitted
last_verified: "2026-08-07"
