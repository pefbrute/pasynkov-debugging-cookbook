id: gnome-shell-autohide-state-lock
title: "Autohide dock panel stuck hidden off-screen or fails to slide out on hover"
status: verified
stack:
  - gnome-shell
  - gjs
  - clutter
  - mutter
versions:
  os: "Ubuntu 22.04 / 24.04 LTS (Linux)"
  runtime: "GNOME Shell 42 / 45 / 46 (GJS, Clutter, Mutter)"
  dependencies:
    mutter: ">= 42.0"
environment:
  hardware: "Any GPU"
  extra: "Wayland and X11 GNOME Shell Sessions"
symptoms:
  - "Dock panel remains completely invisible and stuck off-screen after enabling extension"
  - "Moving mouse cursor to monitor edge fails to bring dock back on screen"
expected_behavior: "Dock panel initializes smoothly in visible state and responds reliably to mouse edge hover triggers"
trigger: "Enable dock extension with autohide manager initializing default state = 'shown' without translation_x reset"
root_cause: "AutohideManager initialized internal state = 'shown' in constructor. Calling showDock() evaluated if (this._state === 'shown') return and returned early without setting actor.translation_x = 0. Scheduled hide passes missing autohideMode === 0 guards moved slider off-screen."
failed_approaches:
  - approach: "Initializing _state = 'shown' while slider actor starts with default off-screen coordinates"
    result: "showDock() short-circuits thinking panel is already visible while actor remains hidden off-screen"
  - approach: "Invoking hideDock() without checking autohideMode === 0"
    result: "Scheduled hide passes translate panel off-screen even when set to Always Visible mode"
fix_summary: "Initialize _state = 'hidden' in AutohideManager constructor, pass showDock(true) force override on extension enable, and enforce autohideMode === 0 guard in hideDock()."
verification:
  automated: true
  command: "node --check right-dock@pasynkov/autohide.js"
  manual_steps:
    - "Enable extension"
    - "Verify dock panel is immediately visible on screen"
    - "Switch to autohide mode and move mouse to edge to test pop out"
regression_risks:
  - "Dock failing to hide if pressure barrier callback fails to fire"
sources:
  - "https://gnome.pages.gitlab.gnome.org/mutter/clutter/class.Actor.html"
upstream:
  project: "GNOME/gnome-shell"
  issue: null
  merge_request: null
  status: not-submitted
last_verified: "2026-08-07"
